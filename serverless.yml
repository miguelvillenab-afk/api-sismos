org: miguelvillenab
service: api-web-scraping

provider:
  name: aws
  runtime: python3.12
  # Default memory size for functions (default: 1024MB)
  memorySize: 2048
  timeout: 90
  iam:
    role: arn:aws:iam::777000342473:role/LabRole
  ecr:
    images:
      scraper:
        path: ./

functions:
  scrape_table:
    image:
      name: scraper
    events:
      - http:
          path: /scrape/table
          method: get
          cors: true
          integration: lambda
resources:
  Resources:
    TablaWebScrapping:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: TablaWebScrappingSismos
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
